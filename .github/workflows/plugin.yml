name: Build in-game plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get BakkesMod SDK, ImGui and JSON
        shell: bash
        run: |
          mkdir -p plugin/external
          git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK plugin/external/BakkesModSDK
          (cd plugin/external && unzip -q BakkesModSDK/imgui_bm.zip)
          git clone --depth 1 https://github.com/nlohmann/json plugin/external/json-src
          mkdir -p plugin/external/json
          cp -r plugin/external/json-src/single_include/nlohmann plugin/external/json/

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build.log
          cmake --build build 2>&1 | tee -a build.log

      - name: Publish build (plugin-build branch)
        if: always()
        shell: bash
        run: |
          mkdir out
          cp build.log out/ 2>/dev/null || true
          cp build/ZLauncherItems.dll out/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > out/BUILD_INFO
          cd out
          git init -q -b plugin-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Plugin build for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" plugin-build
